[package]
name = "zcash-devtool"
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
# `zcash_unstable` is a `--cfg` set via RUSTFLAGS (not a Cargo feature) by the
# zcash crates to opt in to in-development network upgrades; declared here so the
# regtest/inspect code can gate on NU7 without tripping the `unexpected_cfgs` lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }

[dependencies]
anyhow = "1"
coppice = { path = "../coppice/crates/coppice" }
coppice-librustzcash = { path = "../coppice/crates/coppice-librustzcash" }
coppice-names = { git = "https://github.com/nfl0/coppice-names.git", rev = "8493941518c0e3ecb046993b9f5b4b2d29b66307" }
coppice-names-wallet = { git = "https://github.com/nfl0/coppice-names.git", rev = "8493941518c0e3ecb046993b9f5b4b2d29b66307" }
coppice-zcash-rpc = { path = "../coppice/crates/coppice-zcash-rpc" }
bip0039 = { version = "0.14", features = ["std", "all-languages"] }
bip32 = { version = "=0.6.0-pre.1", default-features = false, features = ["secp256k1-ffi"] }
futures-util = "0.3"
hex = "0.4"
jubjub = { package = "zakura-jubjub", version = "=1.0.0" }
nonempty = { version = "0.11", default-features = false }
prost = "0.14"
rayon = "1.7"
ripemd = "0.1"
rusqlite = { version = "0.37", features = ["time"] }
schemerz = "0.2"
secp256k1 = { version = "0.29", features = ["serde"] }
secrecy = "0.8"
serde = "1.0"
time = "0.3"
tokio = { version = "1.21.0", features = ["fs", "io-std", "macros", "rt-multi-thread", "signal"] }
tokio-socks = "0.5"
toml = "0.8"
tonic = { version = "0.14", features = ["gzip", "tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"

# Zcash
#
# Keep one Zakura type family across the devtool, Coppice, and Names crates.
# The `orchard` source is the Coppice extension; the remaining wallet/proving
# crates are the released Zakura packages.
orchard = { package = "zakura-orchard", version = "=1.0.0", default-features = false, features = ["std", "state-note"] }
pczt = { package = "zakura-pczt", version = "=0.1.0-rc2", features = ["io-finalizer", "orchard", "prover", "signer", "spend-finalizer", "transparent", "tx-extractor"] }
sapling = { package = "zakura-sapling-crypto", version = "=1.0.0" }
transparent = { package = "zcash_transparent", version = "0.10.0", features = ["test-dependencies", "transparent-inputs"] }
zcash_address = "0.13.0"
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc4", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt", "tor", "unstable"] }
# `transparent-inputs` is enabled unconditionally: `zcash_client_backend`'s `pczt`
# feature (always on here) already forces `zcash_client_backend/transparent-inputs`,
# so `zcash_client_sqlite` must match or its `WalletRead`/`WalletWrite` impls fail to
# cover the trait's transparent methods.
zcash_client_sqlite = { package = "zakura-client-sqlite", version = "=0.1.0-rc4", features = ["transparent-inputs", "unstable", "orchard", "serde", "test-dependencies"] }
zcash_keys = { package = "zakura-keys", version = "=1.0.0", features = ["orchard", "sapling", "unstable", "unstable-frost"] }
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0" }
zcash_proofs = { package = "zakura-proofs", version = "=1.0.0", features = ["bundled-prover", "directories"] }
zcash_protocol = { version = "=0.10.5", features = ["local-consensus"] }
zcash_script = "0.4"
zip32 = "0.2"
zip321 = "=0.9.0"


# CLI
clap = { version = "4.5", features = ["derive", "string", "unstable-styles"] }

# CSPRNG
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }

# Seed encryption
age = { version = "0.12", features = ["armor", "plugin"] }
chrono = "0.4"
rpassword = "7"

# Currency conversion
iso_currency = { version = "0.5", features = ["with-serde"] }
rust_decimal = "1"

# Inspect
bech32 = "0.11"
bellman = { package = "zakura-bellman", version = "=1.0.0" }
blake2b_simd = "1"
bs58 = "0.5"
ed25519-zebra = "4"
equihash = "0.3"
group = "0.14"
lazy_static = "1"
phf = { version = "0.11", features = ["macros"] }
regex = "1"
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
uint = "0.10"
zcash_encoding = "0.4"
zcash_note_encryption = "0.4.2"

# PCZT QR codes
image = { version = "0.25", optional = true }
minicbor = { version = "2.2", optional = true }
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }
qrcode = { version = "0.14", optional = true, default-features = false }
rqrr = { version = "0.10.1", optional = true }
ur = { version = "0.5", optional = true }

# Tree exploration
incrementalmerkletree = "0.8"
shardtree = "0.7"

# TUI
crossterm = { version = "0.29", optional = true, features = ["event-stream"] }
ratatui = { version = "0.30", optional = true }
roaring = { version = "0.11", optional = true }
tokio-util = { version = "0.7", optional = true }
tui-logger = { version = "0.18", optional = true, features = ["tracing-support"] }

[features]
default = ["transparent-inputs"]
qr = ["dep:qrcode"]
regtest_support = ["zcash_protocol/local-consensus"]
pczt-qr = ["dep:image", "dep:minicbor", "dep:nokhwa", "dep:qrcode", "dep:rqrr", "dep:ur"]
transparent-inputs = [
    "zcash_client_sqlite/transparent-inputs",
]
tui = [
    "dep:crossterm",
    "dep:ratatui",
    "dep:roaring",
    "dep:tokio-util",
    "dep:tui-logger",
]

[patch.crates-io]
# The extension is a package-name patch so every direct and transitive edge
# that asks for `zakura-orchard` resolves to the same Coppice artifact.
zakura-orchard = { git = "https://github.com/nfl0/orchard-coppice.git", rev = "0e09398970130b9510ce5011129acafc5039e79f" }

[patch."https://github.com/nfl0/coppice.git"]
# This repository intentionally develops against sibling Core sources. Names
# pins the same reviewed Core revision for standalone consumers; redirect that
# Git edge here so the devtool never compiles a second, incompatible Core type
# family alongside its local checkout.
coppice = { path = "../coppice/crates/coppice" }
coppice-core = { path = "../coppice/crates/coppice-core" }
coppice-librustzcash = { path = "../coppice/crates/coppice-librustzcash" }
